name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Deployment check — production server boots and serves /
        run: |
          npm run start -- -p 3100 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3100/; then echo "server up"; exit 0; fi
            sleep 2
          done
          echo "server did not respond" >&2
          exit 1
